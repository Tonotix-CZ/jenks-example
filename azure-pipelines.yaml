trigger:
  branches:
    include: [ main ]
  paths:
    include:
      - site/*
      - Dockerfile
      - k8s/*
      - kind-config.yaml
      - azure-pipelines.yml

pool:
  name: laptop-pool

variables:
  CLUSTER_NAME: "kind-ado"
  IMAGE: "html-site"
  TAG: "$(Build.BuildId)"

steps:
- checkout: self

- script: |
    set -eux
    echo "=== Tooling ==="
    docker version
    kubectl version --client=true
    kind version
  displayName: "Preflight"

- script: |
    set -eux

    if kind get clusters | grep -qx "$(CLUSTER_NAME)"; then
      echo "Kind cluster exists: $(CLUSTER_NAME)"
    else
      echo "Creating Kind cluster: $(CLUSTER_NAME)"
      kind create cluster --name "$(CLUSTER_NAME)" --config kind-config.yaml
    fi

    kubectl cluster-info
    kubectl get nodes
  displayName: "Create/Verify Kind cluster"

- script: |
    set -eux
    echo "=== Build Docker image ==="
    docker build -t $(IMAGE):$(TAG) -t $(IMAGE):latest .
  displayName: "Build image"

- script: |
    set -eux
    echo "=== Load image into Kind ==="
    kind load docker-image $(IMAGE):$(TAG) --name "$(CLUSTER_NAME)"
    kind load docker-image $(IMAGE):latest --name "$(CLUSTER_NAME)"
  displayName: "Load image into Kind"

- script: |
    set -eux
    echo "=== Deploy to Kubernetes ==="
    kubectl apply -f k8s/

    # Lab-style refresh when using :latest
    kubectl rollout restart deployment/html-site
    kubectl rollout status deployment/html-site --timeout=180s

    kubectl get svc html-site-svc -o wide
    echo "Open: http://localhost:30080"
  displayName: "Deploy + rollout"
