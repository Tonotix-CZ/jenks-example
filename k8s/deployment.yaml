apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: html-site
  template:
    metadata:
      labels:
        app: html-site
    spec:
      containers:
      - name: html-site
        image: html-site:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
